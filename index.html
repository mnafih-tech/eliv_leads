  <style>
    :root {
      --bg: #0a0f1d;
      --card: #121929;
      --primary: #00ff87;
      --text: #ffffff;
      --border: #2a354d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .badge { background: #1a2c38; color: var(--primary); padding: 0.4rem 0.8rem; border-radius: 20px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; min-height: 250px; }
    input, select, textarea { width: 100%; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 1rem; background: #1a2333; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    button { width: 100%; padding: 0.85rem; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="header">
    <h1 style="color:var(--primary); font-size:1.4rem;">ELIV Lead Scanner</h1>
    <span class="badge" id="count">0 Leads</span>
  </div>

  <div class="grid">
    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:0.5rem;">1. Scan Badge QR</h2>
      <div id="reader"></div>
    </div>

    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:0.5rem;">2. Lead Details</h2>
      <form id="form">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="text" id="company" placeholder="Company">
        <input type="email" id="email" placeholder="Email">
        <select id="interest">
          <option value="Hot">Hot Lead</option>
          <option value="Medium" selected>Medium Interest</option>
          <option value="Low">Low Interest</option>
        </select>
        <textarea id="notes" placeholder="Notes..."></textarea>
        <button type="submit">Save Lead</button>
      </form>
    </div>
  </div>

  <script>
    let leads = JSON.parse(localStorage.getItem('eliv_leads')) || [];
    const countEl = document.getElementById('count');

    function updateCount() { countEl.textContent = `${leads.length} Leads`; }
    
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      leads.unshift({
        name: document.getElementById('name').value,
        company: document.getElementById('company').value,
        email: document.getElementById('email').value,
        interest: document.getElementById('interest').value,
        notes: document.getElementById('notes').value
      });
      localStorage.setItem('eliv_leads', JSON.stringify(leads));
      updateCount();
      e.target.reset();
    });

    // Scanner Initialization
    const scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (text) => {
        if (text.includes('BEGIN:VCARD')) {
          const n = text.match(/FN:(.*)/) || text.match(/N:(.*)/);
          const c = text.match(/ORG:(.*)/);
          const em = text.match(/EMAIL.*:(.*)/);
          if (n) document.getElementById('name').value = n[1].trim();
          if (c) document.getElementById('company').value = c[1].trim();
          if (em) document.getElementById('email').value = em[1].trim();
        } else {
          document.getElementById('name').value = text;
        }
      }
    ).catch(() => {});

    updateCount();

    // Register physical Service Worker for PWA compliance & installation
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered Successfully'))
          .catch(err => console.error('SW Registration Error:', err));
      });
    }
  </script>
</body>
</html>
