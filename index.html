<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIV Lead Scanner</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#00ff87">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    :root {
      --bg: #0a0f1d;
      --card: #121929;
      --primary: #00ff87;
      --danger: #ff4757;
      --text: #ffffff;
      --border: #2a354d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .badge { background: #1a2c38; color: var(--primary); padding: 0.4rem 0.8rem; border-radius: 20px; font-weight: bold; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; min-height: 220px; margin-top: 0.8rem; display: none; }
    
    input, select, textarea { width: 100%; padding: 0.75rem; margin-top: 0.4rem; margin-bottom: 0.8rem; background: #1a2333; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    
    .btn { width: 100%; padding: 0.85rem; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .btn-scan { background: #1a2333; color: var(--primary); border: 1px solid var(--primary); margin-bottom: 0.5rem; }
    .btn-export { background: #60efff; color: #000; margin-bottom: 1rem; }
    .btn-clear { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }
    .btn-delete-item { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 0.25rem 0.6rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }
    .btn-delete-item:hover { background: var(--danger); color: #fff; }

    /* Table Styles */
    .table-container { overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #1a2333; color: var(--primary); }
    .tag-Hot { color: #ff4757; font-weight: bold; }
    .tag-Medium { color: #ffa500; }
    .tag-Low { color: #2ed573; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="header">
    <h1 style="color:var(--primary); font-size:1.4rem;">ELIV Lead Scanner</h1>
    <span class="badge" id="count">0 Leads Saved</span>
  </div>

  <div class="grid">
    <!-- Camera / Scanner Section -->
    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:0.8rem;">1. Badge Scanner</h2>
      <button id="scanToggleBtn" onclick="toggleScanner()" class="btn btn-scan">📷 Start Camera Scanner</button>
      <div id="reader"></div>
    </div>

    <!-- Form Section -->
    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:0.5rem;">2. Lead Details</h2>
      <form id="form">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="text" id="company" placeholder="Company">
        <input type="email" id="email" placeholder="Email Address">
        <input type="tel" id="phone" placeholder="Telefon / Phone Number">
        <select id="interest">
          <option value="Hot">🔥 Hot Lead</option>
          <option value="Medium" selected>⚡ Medium Interest</option>
          <option value="Low">ℹ️ Low / General Info</option>
        </select>
        <textarea id="notes" placeholder="Custom notes / interest details..."></textarea>
        <button type="submit" class="btn">Save Lead</button>
      </form>
    </div>
  </div>

  <!-- View & Export Section -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
      <h2>Saved Leads Logbook</h2>
      <button onclick="clearAllLeads()" class="btn-clear">Delete All</button>
    </div>

    <button onclick="exportToCSV()" class="btn btn-export">📥 Export All Leads to CSV (Excel)</button>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Interest</th>
            <th>Notes</th>
            <th>Date/Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="leadTableBody">
          <!-- Rows injected dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let leads = JSON.parse(localStorage.getItem('eliv_leads')) || [];
    let html5QrcodeScanner = null;
    let isScanning = false;

    function renderLeads() {
      const tbody = document.getElementById('leadTableBody');
      document.getElementById('count').textContent = `${leads.length} Leads Saved`;
      
      if (leads.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888;">No leads captured yet. Scan a badge or enter details above.</td></tr>';
        return;
      }

      tbody.innerHTML = leads.map((l, index) => `
        <tr>
          <td><strong>${escapeHtml(l.name)}</strong></td>
          <td>${escapeHtml(l.company || '-')}</td>
          <td>${escapeHtml(l.email || '-')}</td>
          <td>${escapeHtml(l.phone || '-')}</td>
          <td><span class="tag-${l.interest}">${l.interest}</span></td>
          <td>${escapeHtml(l.notes || '-')}</td>
          <td style="font-size:0.8rem; color:#aaa;">${l.timestamp}</td>
          <td>
            <button onclick="deleteSingleLead(${index})" class="btn-delete-item">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Toggle Camera Scanner On/Off via Button
    function toggleScanner() {
      const btn = document.getElementById('scanToggleBtn');
      const readerBox = document.getElementById('reader');

      if (!isScanning) {
        readerBox.style.display = 'block';
        if (!html5QrcodeScanner) {
          html5QrcodeScanner = new Html5Qrcode("reader");
        }
        
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (text) => {
            // Success QR Scan Callback
            if (text.includes('BEGIN:VCARD')) {
              const n = text.match(/FN:(.*)/) || text.match(/N:(.*)/);
              const c = text.match(/ORG:(.*)/);
              const em = text.match(/EMAIL.*:(.*)/);
              const ph = text.match(/TEL.*:(.*)/);

              if (n) document.getElementById('name').value = n[1].trim();
              if (c) document.getElementById('company').value = c[1].trim();
              if (em) document.getElementById('email').value = em[1].trim();
              if (ph) document.getElementById('phone').value = ph[1].trim();
            } else {
              document.getElementById('name').value = text;
            }
            // Stop scanning after successful read
            toggleScanner();
          }
        ).then(() => {
          isScanning = true;
          btn.textContent = "🛑 Stop Camera Scanner";
          btn.style.background = "var(--danger)";
          btn.style.color = "#fff";
        }).catch(err => {
          alert("Unable to access camera: " + err);
          readerBox.style.display = 'none';
        });

      } else {
        if (html5QrcodeScanner) {
          html5QrcodeScanner.stop().then(() => {
            isScanning = false;
            readerBox.style.display = 'none';
            btn.textContent = "📷 Start Camera Scanner";
            btn.style.background = "#1a2333";
            btn.style.color = "var(--primary)";
          }).catch(() => {});
        }
      }
    }

    // Save Lead Function
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newLead = {
        name: document.getElementById('name').value,
        company: document.getElementById('company').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        interest: document.getElementById('interest').value,
        notes: document.getElementById('notes').value,
        timestamp: new Date().toLocaleString()
      };

      leads.unshift(newLead);
      localStorage.setItem('eliv_leads', JSON.stringify(leads));
      renderLeads();
      e.target.reset();
    });

    // Delete single lead
    function deleteSingleLead(index) {
      const leadName = leads[index].name;
      if (confirm(`Delete lead entry for "${leadName}"?`)) {
        leads.splice(index, 1);
        localStorage.setItem('eliv_leads', JSON.stringify(leads));
        renderLeads();
      }
    }

    // Export to CSV File
    function exportToCSV() {
      if (leads.length === 0) {
        alert("No leads to export!");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Name,Company,Email,Telefon,Interest Level,Notes,Timestamp\n";
      leads.forEach(l => {
        let row = [
          `"${l.name.replace(/"/g, '""')}"`,
          `"${(l.company || '').replace(/"/g, '""')}"`,
          `"${(l.email || '').replace(/"/g, '""')}"`,
          `"${(l.phone || '').replace(/"/g, '""')}"`,
          `"${l.interest}"`,
          `"${(l.notes || '').replace(/"/g, '""')}"`,
          `"${l.timestamp}"`
        ].join(",");
        csvContent += row + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `ELIV_Expo_Leads_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Clear All
    function clearAllLeads() {
      if (confirm("Are you sure you want to delete all saved leads? This cannot be undone.")) {
        leads = [];
        localStorage.removeItem('eliv_leads');
        renderLeads();
      }
    }

    // Initial Load
    renderLeads();

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
