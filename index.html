<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIV Lead Scanner</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <meta name="theme-color" content="#00ff87">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    :root {
      --bg: #0a0f1d;
      --card: #121929;
      --primary: #00ff87;
      --danger: #ff4757;
      --warning: #ffa500;
      --text: #ffffff;
      --border: #2a354d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .badge { background: #1a2c38; color: var(--primary); padding: 0.4rem 0.8rem; border-radius: 20px; font-weight: bold; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; position: relative; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; min-height: 220px; margin-top: 0.8rem; display: none; }
    
    input, select, textarea { width: 100%; padding: 0.75rem; margin-top: 0.4rem; margin-bottom: 0.8rem; background: #1a2333; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    
    .btn { width: 100%; padding: 0.85rem; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-scan { background: #1a2333; color: var(--primary); border: 1px solid var(--primary); margin-bottom: 0.5rem; }
    .btn-export { background: #60efff; color: #000; margin-bottom: 1rem; }
    .btn-clear { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }
    
    .action-btns { display: flex; gap: 0.4rem; }
    .btn-edit-item { background: rgba(96, 239, 255, 0.15); color: #60efff; border: 1px solid #60efff; padding: 0.25rem 0.6rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }
    .btn-edit-item:hover { background: #60efff; color: #000; }
    .btn-delete-item { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 0.25rem 0.6rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }
    .btn-delete-item:hover { background: var(--danger); color: #fff; }

    .edit-mode-indicator { display: none; background: rgba(96, 239, 255, 0.1); border: 1px dashed #60efff; padding: 0.5rem; border-radius: 6px; margin-bottom: 0.8rem; font-size: 0.85rem; color: #60efff; align-items: center; justify-content: space-between; }
    .btn-cancel-edit { background: transparent; color: #aaa; border: 1px solid #555; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-cancel-edit:hover { color: #fff; border-color: #fff; }

    /* Controls & Pagination */
    .controls-row { display: flex; gap: 0.5rem; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .search-input { margin: 0; flex: 1; min-width: 200px; }
    .pagination { display: flex; gap: 0.5rem; align-items: center; }
    .btn-page { background: #1a2333; color: #fff; border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Table Styles */
    .table-container { overflow-x: auto; margin-top: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #1a2333; color: var(--primary); }
    .tag-Hot { color: #ff4757; font-weight: bold; }
    .tag-Medium { color: #ffa500; }
    .tag-Low { color: #2ed573; }

    /* Custom Message Modal */
    #customModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
    .modal-content { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-buttons { display: flex; gap: 0.8rem; margin-top: 1.2rem; justify-content: center; }
    .modal-btn { padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 0.9rem; }
    .modal-btn-confirm { background: var(--primary); color: #000; }
    .modal-btn-cancel { background: #1a2333; color: #fff; border: 1px solid var(--border); }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="header">
    <h1 style="color:var(--primary); font-size:1.4rem;">ELIV Lead Scanner</h1>
    <span class="badge" id="count">0 Leads Saved</span>
  </div>

  <div class="grid">
    <!-- Camera / Scanner Section -->
    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:0.8rem;">1. Badge Scanner</h2>
      <button id="scanToggleBtn" onclick="toggleScanner()" class="btn btn-scan">📷 Start Camera Scanner</button>
      <div id="reader"></div>
    </div>

    <!-- Form Section -->
    <div class="card">
      <div id="editIndicator" class="edit-mode-indicator">
        <span>✏️ Editing Existing Lead</span>
        <button type="button" onclick="cancelEditMode()" class="btn-cancel-edit">Cancel Edit</button>
      </div>
      <h2 id="formTitle" style="font-size:1.1rem; margin-bottom:0.5rem;">2. Lead Details</h2>
      <form id="form">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="text" id="company" placeholder="Company">
        <input type="email" id="email" placeholder="Email Address">
        <input type="tel" id="phone" placeholder="Telefon / Phone Number">
        <select id="interest">
          <option value="Hot">🔥 Hot Lead</option>
          <option value="Medium" selected>⚡ Medium Interest</option>
          <option value="Low">ℹ️ Low / General Info</option>
        </select>
        <textarea id="notes" placeholder="Custom notes / interest details..."></textarea>
        <button type="submit" id="formSubmitBtn" class="btn">Save Lead</button>
      </form>
    </div>
  </div>

  <!-- View & Export Section -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
      <h2>Saved Leads Logbook</h2>
      <button onclick="confirmClearAll()" class="btn-clear">Delete All</button>
    </div>

    <button onclick="exportToCSV()" class="btn btn-export">📥 Export All Leads to CSV (Excel)</button>

    <div class="controls-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by name, company, email..." oninput="handleSearch()">
      <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)" class="btn-page">◀ Prev</button>
        <span id="pageIndicator" style="font-size: 0.85rem; color: #aaa;">Page 1</span>
        <button id="nextBtn" onclick="changePage(1)" class="btn-page">Next ▶</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Interest</th>
            <th>Notes</th>
            <th>Date/Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="leadTableBody">
          <!-- Rows injected dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Custom Modal Box (Replaces alert/confirm) -->
  <div id="customModal">
    <div class="modal-content">
      <p id="modalMessage" style="margin-bottom: 0.5rem; font-size: 1rem; line-height: 1.4;"></p>
      <div class="modal-buttons" id="modalButtons">
        <button id="modalConfirmBtn" class="modal-btn modal-btn-confirm">OK</button>
        <button id="modalCancelBtn" class="modal-btn modal-btn-cancel" style="display:none;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let leads = [];
    try {
      leads = JSON.parse(localStorage.getItem('eliv_leads')) || [];
    } catch (e) {
      console.error("Failed to parse leads from storage:", e);
      leads = [];
    }

    // Ensure legacy leads have unique IDs
    leads = leads.map(l => ({
      id: l.id || ('lead_' + Math.random().toString(36).substr(2, 9) + Date.now()),
      ...l
    }));

    let currentPage = 1;
    const pageSize = 20;
    let filteredLeads = [...leads];
    let html5QrcodeScanner = null;
    let isScanning = false;
    let editingLeadId = null; // Tracks active edit state

    // Custom non-blocking notification/confirm dialogs
    function showModalMessage(message, isConfirm = false, onConfirm = null) {
      const modal = document.getElementById('customModal');
      const msgEl = document.getElementById('modalMessage');
      const confirmBtn = document.getElementById('modalConfirmBtn');
      const cancelBtn = document.getElementById('modalCancelBtn');

      msgEl.textContent = message;
      modal.style.display = 'flex';

      // Clean old listeners
      const newConfirm = confirmBtn.cloneNode(true);
      const newCancel = cancelBtn.cloneNode(true);
      confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
      cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

      if (isConfirm) {
        document.getElementById('modalCancelBtn').style.display = 'inline-block';
        document.getElementById('modalConfirmBtn').textContent = 'Confirm';
        document.getElementById('modalConfirmBtn').onclick = () => {
          modal.style.display = 'none';
          if (onConfirm) onConfirm();
        };
        document.getElementById('modalCancelBtn').onclick = () => {
          modal.style.display = 'none';
        };
      } else {
        document.getElementById('modalCancelBtn').style.display = 'none';
        document.getElementById('modalConfirmBtn').textContent = 'OK';
        document.getElementById('modalConfirmBtn').onclick = () => {
          modal.style.display = 'none';
        };
      }
    }

    // Safe LocalStorage Saving
    function persistLeads() {
      try {
        localStorage.setItem('eliv_leads', JSON.stringify(leads));
        return true;
      } catch (e) {
        showModalMessage("⚠️ Storage quota reached! Please export your current leads to CSV and delete old records to prevent data loss.");
        return false;
      }
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        filteredLeads = [...leads];
      } else {
        filteredLeads = leads.filter(l => 
          (l.name && l.name.toLowerCase().includes(query)) ||
          (l.company && l.company.toLowerCase().includes(query)) ||
          (l.email && l.email.toLowerCase().includes(query)) ||
          (l.notes && l.notes.toLowerCase().includes(query))
        );
      }
      currentPage = 1;
      renderLeads();
    }

    function changePage(delta) {
      const maxPage = Math.ceil(filteredLeads.length / pageSize) || 1;
      currentPage = Math.min(Math.max(1, currentPage + delta), maxPage);
      renderLeads();
    }

    function renderLeads() {
      const tbody = document.getElementById('leadTableBody');
      document.getElementById('count').textContent = `${leads.length} Leads Saved`;

      if (filteredLeads.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888;">No leads found.</td></tr>';
        document.getElementById('pageIndicator').textContent = 'Page 0 of 0';
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
        return;
      }

      const totalPages = Math.ceil(filteredLeads.length / pageSize);
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * pageSize;
      const visibleLeads = filteredLeads.slice(startIndex, startIndex + pageSize);

      document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage === totalPages;

      tbody.innerHTML = visibleLeads.map((l) => {
        return `
          <tr>
            <td><strong>${escapeHtml(l.name || '')}</strong></td>
            <td>${escapeHtml(l.company || '-')}</td>
            <td>${escapeHtml(l.email || '-')}</td>
            <td>${escapeHtml(l.phone || '-')}</td>
            <td><span class="tag-${escapeHtml(l.interest || 'Medium')}">${escapeHtml(l.interest || 'Medium')}</span></td>
            <td>${escapeHtml(l.notes || '-')}</td>
            <td style="font-size:0.8rem; color:#aaa;">${escapeHtml(l.timestamp || '')}</td>
            <td>
              <div class="action-btns">
                <button onclick="startEditLead('${l.id}')" class="btn-edit-item">Edit</button>
                <button onclick="confirmDeleteLead('${l.id}')" class="btn-delete-item">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function startEditLead(id) {
      const lead = leads.find(l => l.id === id);
      if (!lead) return;

      editingLeadId = id;
      document.getElementById('name').value = lead.name || '';
      document.getElementById('company').value = lead.company || '';
      document.getElementById('email').value = lead.email || '';
      document.getElementById('phone').value = lead.phone || '';
      document.getElementById('interest').value = lead.interest || 'Medium';
      document.getElementById('notes').value = lead.notes || '';

      document.getElementById('formTitle').textContent = "2. Edit Lead Details";
      document.getElementById('formSubmitBtn').textContent = "Update Lead";
      document.getElementById('formSubmitBtn').style.background = "#60efff";
      document.getElementById('formSubmitBtn').style.color = "#000";
      document.getElementById('editIndicator').style.display = 'flex';

      // Scroll form into view nicely on mobile
      document.getElementById('form').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEditMode() {
      editingLeadId = null;
      document.getElementById('form').reset();
      document.getElementById('formTitle').textContent = "2. Lead Details";
      document.getElementById('formSubmitBtn').textContent = "Save Lead";
      document.getElementById('formSubmitBtn').style.background = "var(--primary)";
      document.getElementById('formSubmitBtn').style.color = "#000";
      document.getElementById('editIndicator').style.display = 'none';
    }

    function toggleScanner() {
      const btn = document.getElementById('scanToggleBtn');
      const readerBox = document.getElementById('reader');

      if (!isScanning) {
        readerBox.style.display = 'block';
        if (!html5QrcodeScanner) {
          html5QrcodeScanner = new Html5Qrcode("reader");
        }
        
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (text) => {
            let scannedName = text;
            let scannedCompany = "";
            let scannedEmail = "";
            let scannedPhone = "";

            if (text.includes('BEGIN:VCARD')) {
              const n = text.match(/FN:(.*)/) || text.match(/N:(.*)/);
              const c = text.match(/ORG:(.*)/);
              const em = text.match(/EMAIL.*:(.*)/);
              const ph = text.match(/TEL.*:(.*)/);

              if (n) scannedName = n[1].trim();
              if (c) scannedCompany = c[1].trim();
              if (em) scannedEmail = em[1].trim();
              if (ph) scannedPhone = ph[1].trim();
            }

            // Check if lead already exists in logbook by email or exact name
            const existingLead = leads.find(l => 
              (scannedEmail && l.email && l.email.toLowerCase() === scannedEmail.toLowerCase()) ||
              (l.name && l.name.toLowerCase() === scannedName.toLowerCase())
            );

            if (existingLead) {
              // Automatically switch to edit mode for this existing record
              startEditLead(existingLead.id);
              showModalMessage(`ℹ️ Lead "${existingLead.name}" already exists in your logbook. Switched to Edit mode so you can update notes.`);
            } else {
              // Populate new entry fields
              document.getElementById('name').value = scannedName;
              document.getElementById('company').value = scannedCompany;
              document.getElementById('email').value = scannedEmail;
              document.getElementById('phone').value = scannedPhone;
              showModalMessage(`✅ Scanned new lead: ${scannedName}`);
            }

            toggleScanner();
          }
        ).then(() => {
          isScanning = true;
          btn.textContent = "🛑 Stop Camera Scanner";
          btn.style.background = "var(--danger)";
          btn.style.color = "#fff";
        }).catch(err => {
          showModalMessage("Unable to access camera: " + err);
          readerBox.style.display = 'none';
        });

      } else {
        if (html5QrcodeScanner) {
          html5QrcodeScanner.stop().then(() => {
            isScanning = false;
            readerBox.style.display = 'none';
            btn.textContent = "📷 Start Camera Scanner";
            btn.style.background = "#1a2333";
            btn.style.color = "var(--primary)";
          }).catch(() => {});
        }
      }
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const nameVal = document.getElementById('name').value.trim();
      const companyVal = document.getElementById('company').value.trim();
      const emailVal = document.getElementById('email').value.trim();
      const phoneVal = document.getElementById('phone').value.trim();
      const interestVal = document.getElementById('interest').value;
      const notesVal = document.getElementById('notes').value.trim();
      const timestampVal = new Date().toLocaleString();

      if (editingLeadId) {
        // Update existing lead
        const leadIndex = leads.findIndex(l => l.id === editingLeadId);
        if (leadIndex !== -1) {
          leads[leadIndex] = {
            ...leads[leadIndex],
            name: nameVal,
            company: companyVal,
            email: emailVal,
            phone: phoneVal,
            interest: interestVal,
            notes: notesVal,
            timestamp: timestampVal // update timestamp to reflect edit time
          };
          persistLeads();
          showModalMessage("Lead successfully updated!");
        }
        cancelEditMode();
      } else {
        // Create new lead with unique ID
        const newLead = {
          id: 'lead_' + Math.random().toString(36).substr(2, 9) + Date.now(),
          name: nameVal,
          company: companyVal,
          email: emailVal,
          phone: phoneVal,
          interest: interestVal,
          notes: notesVal,
          timestamp: timestampVal
        };

        leads.unshift(newLead);
        persistLeads();
        e.target.reset();
        showModalMessage("New lead successfully saved!");
      }

      handleSearch();
    });

    // Delete single lead with custom confirmation modal
    function confirmDeleteLead(id) {
      const lead = leads.find(l => l.id === id);
      if (!lead) return;

      showModalMessage(`Are you sure you want to delete lead entry for "${lead.name}"?`, true, () => {
        leads = leads.filter(l => l.id !== id);
        persistLeads();
        if (editingLeadId === id) cancelEditMode();
        handleSearch();
      });
    }

    // Export to CSV File (Memory Safe Blob URL)
    function exportToCSV() {
      if (leads.length === 0) {
        showModalMessage("No leads to export!");
        return;
      }

      let csvRows = ["Name,Company,Email,Telefon,Interest Level,Notes,Timestamp"];
      leads.forEach(l => {
        let row = [
          `"${(l.name || '').replace(/"/g, '""')}"`,
          `"${(l.company || '').replace(/"/g, '""')}"`,
          `"${(l.email || '').replace(/"/g, '""')}"`,
          `"${(l.phone || '').replace(/"/g, '""')}"`,
          `"${(l.interest || '').replace(/"/g, '""')}"`,
          `"${(l.notes || '').replace(/"/g, '""')}"`,
          `"${(l.timestamp || '').replace(/"/g, '""')}"`
        ].join(",");
        csvRows.push(row);
      });

      const blob = new Blob([csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `ELIV_Expo_Leads_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // Clear All with confirmation modal
    function confirmClearAll() {
      if (leads.length === 0) {
        showModalMessage("No leads to delete.");
        return;
      }
      showModalMessage("Are you sure you want to delete all saved leads? This cannot be undone.", true, () => {
        leads = [];
        localStorage.removeItem('eliv_leads');
        cancelEditMode();
        handleSearch();
      });
    }

    // Initial Load
    handleSearch();

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
